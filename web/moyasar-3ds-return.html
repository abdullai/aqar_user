<!DOCTYPE html>

<html lang="ar">

<head>

  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>إكمال الدفع — موثوق لاين العقارية</title>

  <style>

    body {

      font-family: system-ui, sans-serif;

      margin: 0;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #f6f8fb;

      color: #1a1a1a;

      direction: rtl;

    }

    .box {

      text-align: center;

      padding: 32px 24px;

      max-width: 420px;

      background: #fff;

      border-radius: 16px;

      box-shadow: 0 8px 32px rgba(0,0,0,0.08);

    }

    .spinner {

      width: 40px;

      height: 40px;

      border: 3px solid #e0e0e0;

      border-top-color: #1a237e;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

      margin: 0 auto 16px;

    }

    @keyframes spin { to { transform: rotate(360deg); } }

    h1 { font-size: 18px; margin: 0 0 8px; color: #1a237e; }

    p { margin: 0; color: #555; font-size: 14px; line-height: 1.5; }

    .ok { color: #2e7d32; }

    .err { color: #c62828; }

  </style>

</head>

<body>

  <div class="box" id="app">

    <div class="spinner" id="spinner"></div>

    <h1 id="title">جارٍ إكمال التحقق من الدفع…</h1>

    <p id="message">يرجى الانتظار حتى اكتمال التحقق من البنك</p>

  </div>

  <script>

    (function () {

      var params = new URLSearchParams(window.location.search);

      var status = (params.get('status') || '').trim();

      var id = (params.get('id') || params.get('payment_id') || '').trim();

      var message = (params.get('message') || params.get('error') || '').trim();

      var target = window.location.href;



      function notifyOpener() {

        try {

          if (window.opener && !window.opener.closed) {

            window.opener.postMessage({

              type: 'moyasar-3ds-return',

              status: status,

              paymentId: id,

              payment_id: id,

              message: message,

              url: target,

              timestamp: Date.now()

            }, '*');

            return true;

          }

        } catch (_) {}

        return false;

      }



      var notified = notifyOpener();

      var spinner = document.getElementById('spinner');

      var title = document.getElementById('title');

      var msg = document.getElementById('message');



      var isPaid = status === 'paid' || status === 'authorized' || status === 'captured';

      var isFailed = status === 'failed' || status === 'cancelled' || status === 'error';



      if (notified) {

        setTimeout(function () {

          try { window.close(); } catch (_) {}

        }, 1200);

      }



      if (isPaid) {

        spinner.style.display = 'none';

        title.textContent = 'تم الدفع بنجاح';

        title.className = 'ok';

        msg.textContent = 'سيتم تحديث اشتراكك خلال لحظات.';

        if (!notified && id) {

          setTimeout(function () {

            window.location.replace('/?moyasar_payment=' + encodeURIComponent(id));

          }, 2000);

        }

      } else if (isFailed) {

        spinner.style.display = 'none';

        title.textContent = 'فشل الدفع';

        title.className = 'err';

        msg.textContent = message || 'حدث خطأ أثناء إتمام الدفع.';

        if (!notified) {

          setTimeout(function () {

            window.location.replace('/?moyasar_status=' + encodeURIComponent(status || 'failed'));

          }, 2500);

        }

      } else if (!notified) {

        setTimeout(function () {

          window.location.replace('/?moyasar_status=' + encodeURIComponent(status || 'return'));

        }, 1500);

      }

    })();

  </script>

</body>

</html>
