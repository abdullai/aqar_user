<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Supabase on web: add web/supabase_config.json (see web/supabase_config.json.example) before deploy, or pass --dart-define=SUPABASE_ANON_KEY=... in your build. -->
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="Motawoq Real Estate — trusted real estate app">

  <!-- Mobile support -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="موثوق لاين">

  <!-- viewport-fit + interactive-widget=resizes-visual:
       يمرّر ارتفاع لوحة المفاتيح إلى Flutter عبر MediaQuery.viewInsets
       (resizes-content كان يُصغّر النافذة ويترك inset=0 فيغطّي الحقل). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-visual">

  <!-- Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>مؤسسة موثوق لاين العقارية</title>
  <link rel="manifest" href="manifest.json">

  <!-- خطوط Flutter تُحمَّل عبر FontManifest — preload المبكر يسبب تحذيرات Console -->
  <link rel="preconnect" href="https://czfvqhepsqkgsrfnknwm.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://czfvqhepsqkgsrfnknwm.supabase.co">
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin="anonymous">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #F3F6F8;
      background-image: radial-gradient(ellipse at 50% 35%, #E6F4F1 0%, #F3F6F8 55%, #EEF2F5 100%);
      touch-action: manipulation;
      min-height: 100%;
      min-height: 100dvh;
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #071210;
        background-image: radial-gradient(ellipse at 50% 35%, #0F1C19 0%, #071210 55%, #050C0A 100%);
      }
      #splash {
        background: radial-gradient(ellipse at 50% 35%, #0F1C19 0%, #071210 55%, #050C0A 100%);
      }
    }

    input, textarea, select {
      font-size: 16px;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 35%, #E6F4F1 0%, #F3F6F8 55%, #EEF2F5 100%);
    }

    @media (prefers-color-scheme: dark) {
      #splash {
        background: radial-gradient(ellipse at 50% 35%, #0F1C19 0%, #071210 55%, #050C0A 100%);
      }
    }

    #splash img {
      width: min(72vw, 280px);
      height: auto;
      max-height: 42vh;
      object-fit: contain;
    }
  </style>

  <script>
    /* ثبّت نافذة المتصفح عند فتح كيبورد الجوال حتى لا يقفز حقل Flutter لأعلى الشاشة.
       التمرير الداخلي في التطبيق هو من يُظهر الحقل فوق اللوحة مع قائمة البحث. */
    (function () {
      function pinViewport() {
        try { window.scrollTo(0, 0); } catch (e) {}
      }
      function restoreLayoutViewport() {
        try {
          var h = window.innerHeight || 0;
          if (h > 0) {
            document.documentElement.style.height = h + "px";
            document.body.style.height = h + "px";
            document.documentElement.style.minHeight = h + "px";
          }
          window.scrollTo(0, 0);
        } catch (e) {}
      }
      window.addEventListener("scroll", pinViewport, { passive: true });
      document.addEventListener("focusin", function () {
        pinViewport();
        setTimeout(pinViewport, 40);
        setTimeout(pinViewport, 220);
      }, true);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") {
          restoreLayoutViewport();
          setTimeout(restoreLayoutViewport, 50);
          setTimeout(restoreLayoutViewport, 250);
          setTimeout(restoreLayoutViewport, 700);
        }
      });
      window.addEventListener("pageshow", restoreLayoutViewport);
      window.addEventListener("orientationchange", function () {
        setTimeout(restoreLayoutViewport, 80);
        setTimeout(restoreLayoutViewport, 400);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", pinViewport);
        window.visualViewport.addEventListener("scroll", pinViewport);
      }
      restoreLayoutViewport();
    })();
  </script>
  <script>
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      if (document.body) document.body.style.background = "transparent";
    }

    function pickBootSplashSrc() {
      var narrow = window.matchMedia("(max-width: 700px)").matches;
      var shortSide = Math.min(window.innerWidth || 0, window.innerHeight || 0);
      var phoneLike = shortSide > 0 && shortSide < 600;
      var ua = (navigator.userAgent || "").toLowerCase();
      // هاتف فقط (ليس آيباد) أو شاشة ضيّقة → تطبيق؛ آيباد/ويندوز عريض → مؤسسة
      var phoneUa = /mobi|android|iphone|ipod/.test(ua) && !/ipad/.test(ua);
      return (phoneLike || narrow || phoneUa)
        ? "assets/assets/splashscreen.png"
        : "assets/assets/logo.png";
    }
  </script>

  <!--
    Maps JS: key is NOT in this file. Flutter loads it from dart-define / dotenv /
    web/supabase_config.json (GOOGLE_MAPS_WEB_KEY). Restrict the key in Google Cloud
    to this host (HTTP referrers) and Maps JavaScript API + Places only.
  -->
  <script>
    window.aqarLoadGoogleMapsJs = function (key) {
      if (window.google && window.google.maps) return Promise.resolve();
      if (!key) return Promise.resolve();
      if (window.__aqarMapsLoading) return window.__aqarMapsLoading;
      window.__aqarMapsLoading = new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key) + "&libraries=places&loading=async";
        s.async = true;
        s.onload = function () { resolve(); };
        s.onerror = function () { reject(new Error("maps_js")); };
        document.head.appendChild(s);
      });
      return window.__aqarMapsLoading;
    };
  </script>
</head>

<body>
  <div id="splash" aria-hidden="true">
    <img id="boot-splash-img" alt="" src="assets/assets/logo.png">
  </div>
  <script>
    (function () {
      var img = document.getElementById("boot-splash-img");
      if (img) img.src = pickBootSplashSrc();
    })();
  </script>

  <!--
    Service Worker: المشروع يضمّ `web/flutter_bootstrap.js` يستدعي `_flutter.loader.load({})` بدون
    service worker — يتفادى "prepareServiceWorker took more than 4000ms" وأخطاء Cache.put/206.
    للبناء: ما زال `flutter build web --pwa-strategy=none` مفيداً (مضمّن في firebase.json predeploy).
    بعد نشر قديم: DevTools → Application → Unregister service workers → Hard reload.
  -->
  <script>
    /* إلغاء تسجيل Service Workers القديمة يقلّل أخطاء Cache.put + 206 بعد تغيير نسخة Flutter. */
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
      });
    }
  </script>
  <script>
    /* إزالة طبقات semantics العالقة — Flutter web #175119
       كان التوقف بعد 20 ثانية يترك التجمّد دائماً إن ظهرت الطبقة لاحقاً. */
    window.aqarUnblockPointer = function aqarUnblockPointer() {
      var removed = 0;
      try {
        document.querySelectorAll('flt-semantics-placeholder').forEach(function (el) {
          var r = el.getBoundingClientRect();
          if (r.width >= window.innerWidth * 0.85 && r.height >= window.innerHeight * 0.85) {
            el.style.pointerEvents = 'none';
            removed++;
          }
        });
      } catch (e) {}
      return removed;
    };
    (function () {
      var ticks = 0;
      setInterval(function () {
        ticks++;
        // أول 30 ثانية: كل ثانية؛ بعدها نتخطى معظم النبضات (كل 5 ثوانٍ).
        if (ticks > 30 && (ticks % 5) !== 0) return;
        try { window.aqarUnblockPointer(); } catch (e) {}
      }, 1000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
