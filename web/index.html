<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Supabase on web: add web/supabase_config.json (see web/supabase_config.json.example) before deploy, or pass --dart-define=SUPABASE_ANON_KEY=... in your build. -->
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="Motawoq Real Estate — trusted real estate app">

  <!-- Mobile support -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="aqar_user">

  <!-- viewport-fit + interactive-widget: تحسين لوحة المفاتيح على iOS/Safari للويب -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content">

  <!-- Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>aqar_user</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0F766E;
      /* يقلّل تعارض اللمس مع التمرير ويحسّن التركيز على الحقول */
      touch-action: manipulation;
      /* متصفحات الجوال: ارتفاع نافذة أوضح مع شريط العنوان الديناميكي */
      min-height: 100%;
      min-height: 100dvh;
    }

    /* iOS: حجم خط ≥16px يمنع تكبير الصفحة عند التركيز في حقول الإدخال */
    input, textarea, select {
      font-size: 16px;
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>

  <script>
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.body.style.background = "transparent";
    }
  </script>

  <!--
    Maps JavaScript API: load before Flutter so google_maps_flutter_web can initialize.
    In Google Cloud Console: enable "Maps JavaScript API" + Places (if used), link billing,
    and add HTTP referrer restrictions for your hosts (e.g. https://*.web.app/* ,
    https://*.firebaseapp.com/* , localhost for dev).
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB1GB51H6O-8O5wab9WnEDSj5aY_qQL4Vs&libraries=places&loading=async"></script>
</head>

<body>
  <picture id="splash">
    <source
      srcset="
        splash/img/light-1x.png 1x,
        splash/img/light-2x.png 2x,
        splash/img/light-3x.png 3x,
        splash/img/light-4x.png 4x"
      media="(prefers-color-scheme: light)">

    <source
      srcset="
        splash/img/dark-1x.png 1x,
        splash/img/dark-2x.png 2x,
        splash/img/dark-3x.png 3x,
        splash/img/dark-4x.png 4x"
      media="(prefers-color-scheme: dark)">

    <img
      class="center"
      src="splash/img/light-1x.png"
      alt=""
      aria-hidden="true">
  </picture>

  <!--
    Service Worker: المشروع يضمّ `web/flutter_bootstrap.js` يستدعي `_flutter.loader.load({})` بدون
    service worker — يتفادى "prepareServiceWorker took more than 4000ms" وأخطاء Cache.put/206.
    للبناء: ما زال `flutter build web --pwa-strategy=none` مفيداً (مضمّن في firebase.json predeploy).
    بعد نشر قديم: DevTools → Application → Unregister service workers → Hard reload.
  -->
  <script>
    /* إلغاء تسجيل Service Workers القديمة يقلّل أخطاء Cache.put + 206 بعد تغيير نسخة Flutter. */
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
