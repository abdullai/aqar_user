# ==============================
# JVM memory settings
# ==============================
# On low-RAM machines (e.g. 2GB total), -Xmx8G + 4G metaspace causes native OOM and
# Gradle daemon crashes (see hs_err_pid*.log: "insufficient memory", R8/C2 compiler).
# R8 minify needs a larger heap than 768m or it throws Java heap OOM; app/build.gradle.kts
# disables minify/shrink on release for this machine — re-enable when building on ≥8GB RAM or CI.
# If the daemon crashes again (native OOM), lower -Xmx and keep minify disabled.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC

# ==============================
# AndroidX
# ==============================
android.useAndroidX=true

# ==============================
# Force Gradle to use JDK 17
# (تأكد أن المسار صحيح عندك)
# ==============================
org.gradle.java.home=C:\\Users\\2023\\Downloads\\jdk-17.0.18+8

# ==============================
# Kotlin fixes
# ==============================
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvm.options=-Xmx512m

# إذا استمر تعارض JVM target
kotlin.jvm.target.validation.mode=IGNORE

# ==============================
# Suppress warnings (اختياري)
# ==============================
android.javaCompile.suppressSourceTargetDeprecationWarning=true
org.gradle.warning.mode=none